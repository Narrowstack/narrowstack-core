name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  manifest:
    name: manifest lint + schema tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate example manifests against schema
        run: npm run lint:manifest
      - name: Schema + fixture tests
        run: npm test

  shellcheck:
    name: shellcheck deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck deploy/*.sh scripts/*.sh
