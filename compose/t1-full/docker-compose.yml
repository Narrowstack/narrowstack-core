# T1 — Full instance compose template (Wave 0 skeleton).
# Postgres runs locally on the Cloud VM; the semantics engine and app mount the
# pinned refs. Secrets are injected at provision time via `op run` using the
# accompanying .env.tpl (op:// references only).
#
# This template is intentionally minimal and unwired for W0; services are fleshed
# out in W2 from the manual rebuild recipe in core-architecture.md.
name: ns-core-t1

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DATABASE:-narrowstack}
      POSTGRES_USER: ${PG_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${PG_SUPERUSER_PASSWORD:?set via op run}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SUPERUSER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # TODO (W2): semantics engine (dbt + MetricFlow) mounting narrowstack-semantics
  #            at the pinned ref, using per-role Postgres credentials.
  # TODO (W2): app (narrowstack-core-app) consuming the generated semantic
  #            manifest artifact and a SELECT-only Postgres role.
  # TODO (W2): reverse proxy fronting the app.

volumes:
  pgdata:
