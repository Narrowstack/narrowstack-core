name: semantics-template-ci
on:
  pull_request:
    paths:
      - "semantics/**"
  push:
    branches: [main]

jobs:
  allowlist-stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Allowlist check (stub)
        run: python3 semantics/scripts/check-allowlist.py
